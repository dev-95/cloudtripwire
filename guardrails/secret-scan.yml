# CloudTripwire guardrail: scan every push and pull request for secrets with gitleaks.
#
# Copy this file to .github/workflows/secret-scan.yml in your repo. That's it.
# A leaked key fails the run, and the log shows the file, line and commit (the secret
# itself is redacted). If a key was pushed, deactivate it in IAM now: bots find
# public keys within minutes. CloudTripwire's kill switch does this automatically
# when AWS reports the key.
#
# Pinned: actions/checkout by release tag, gitleaks by version + SHA-256 of the
# release tarball, so a changed download fails instead of running. To update,
# take the new version's checksum from the release's gitleaks_<v>_checksums.txt.
# Also callable from another workflow (workflow_call) if you keep it in .github/workflows.

name: Secret scan

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # full history: a secret removed later is still in git history
      - name: Install gitleaks (pinned release, checksum verified)
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum --check
          tar -xzf "$tarball" gitleaks
      - name: Scan git history
        run: ./gitleaks git --redact --no-banner --verbose .
