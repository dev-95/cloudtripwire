# CloudTripwire guardrail: block secrets (AWS keys, tokens) before they are committed.
#
# 1. pip install pre-commit
# 2. Paste the `repos:` entry below into your repo's .pre-commit-config.yaml
#    (or copy this file there if you have none).
# 3. pre-commit install
#
# Every `git commit` then scans the staged changes with gitleaks and refuses the
# commit if it finds a secret. Scan everything once with: pre-commit run --all-files
#
# pre-commit builds gitleaks from source the first time (it downloads Go itself).
# rev is pinned to a release tag; update with: pre-commit autoupdate
#
# Windows with Smart App Control may block the binary pre-commit builds. Then install
# gitleaks (winget install Gitleaks.Gitleaks) and use the local hook at the bottom instead.

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

# Alternative (gitleaks already on PATH), replace the entry above with:
