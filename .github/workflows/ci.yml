name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check
      - run: ruff format --check
      - run: python -m pytest

  terraform:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # versions.tf allows >= 1.5: test the oldest supported and the newest 1.x.
        terraform: ["1.5.x", "1.x"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false
      - run: terraform fmt -check -recursive
        working-directory: terraform
      # The module needs an aws.us_east_1 provider from its caller, so it can't be
      # validated on its own; validating examples/basic checks the whole module.
      - run: terraform init -backend=false -input=false && terraform validate
        working-directory: terraform/examples/basic

  secrets:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # full history
      - name: Install gitleaks (pinned release, checksum verified)
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum --check
          tar -xzf "$tarball" gitleaks
      - run: ./gitleaks git --redact --no-banner --verbose .

  iam-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - run: python scripts/check_iam.py terraform/iam.tf
