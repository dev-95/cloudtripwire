[project]
name = "cloudtripwire"
version = "0.0.0"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["*.md"]  # keep spec code samples as written

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Serial is fastest for now (~4s); `-n auto` (pytest-xdist) adds ~1s warm-up per worker.
addopts = "-q"
